<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Hornetão Blue 🍀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding-bottom: 40px;
        }

        /* Menu Superior */
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .banner {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            background-color: #334155;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        .preco {
            font-size: 1.1rem;
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Botões de Seleção de Cotas */
        .grid-cotas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-cota {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cota:hover {
            background-color: #0284c7;
            border-color: #38bdf8;
        }

        /* Formulario e Input */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn-pagar {
            width: 100%;
            background-color: #22c55e;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-pagar:hover {
            background-color: #16a34a;
        }

        /* Modal Pix */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .qr-code-img {
            width: 200px;
            height: 200px;
            margin: 15px auto;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            display: block;
        }

        .btn-copiar {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-copiar:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <!-- Menu Superior Direito -->
    <header>
        <div class="logo">🏍️ Hornetão Blue</div>
        <nav>
            <a href="#" onclick="alert('Área de bilhetes em breve!')">Meus Bilhetes</a>
            <a href="#" onclick="alert('Termos de Uso: Sorteio baseado na Loteria Federal.')">Termos</a>
            <a href="#" onclick="alert('Suporte via WhatsApp: (00) 00000-0000')">Suporte</a>
        </nav>
    </header>

    <div class="container">
        <!-- Banner Principal da Rifa -->
        <div class="banner">
            [ Foto da Hornetão Blue ]
        </div>

        <div class="card">
            <h2>Rifa Hornetão Blue 600cc</h2>
            <p class="preco">R$ 2,00 por cota</p>

            <!-- Seleção de Cotas -->
            <label>Escolha a quantidade de cotas:</label>
            <div class="grid-cotas">
                <button class="btn-cota" onclick="adicionarCotas(5)">+5</button>
                <button class="btn-cota" onclick="adicionarCotas(10)">+10</button>
                <button class="btn-cota" onclick="adicionarCotas(50)">+50</button>
                <button class="btn-cota" onclick="adicionarCotas(100)">+100</button>
            </div>

            <form id="formRifa" onsubmit="gerarPix(event)">
                <div class="form-group">
                    <label for="qtdCotas">Quantidade selecionada:</label>
                    <input type="number" id="qtdCotas" value="5" min="1" oninput="atualizarTotal()" required>
                </div>

                <div class="form-group">
                    <label for="cpf">Informe seu CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" required>
                </div>

                <div class="form-group">
                    <label>Valor Total:</label>
                    <input type="text" id="valorTotalDisplay" value="R$ 10,00" readonly style="font-weight: bold; color: #22c55e;">
                </div>

                <button type="submit" class="btn-pagar" id="btnSubmit">PAGAR COM PIX AGORA 🍀</button>
            </form>
        </div>
    </div>

    <!-- Modal Pix -->
    <div class="modal" id="modalPix">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h3 style="color: #22c55e;">Pix Gerado com Sucesso!</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 5px;">Escaneie o QR Code ou copie a chave abaixo:</p>
            
            <img id="imagemQrCode" class="qr-code-img" src="" alt="QR Code Pix">

            <div class="form-group">
                <input type="text" id="campoPixCopiaCola" readonly style="font-size: 0.8rem; text-align: center;">
            </div>

            <button class="btn-copiar" onclick="copiarPix()">COPIAR CÓDIGO PIX 📋</button>
        </div>
    </div>

    <script>
        const PRECO_UNIDADE = 2.00;

        function atualizarTotal() {
            const qtd = parseInt(document.getElementById('qtdCotas').value) || 0;
            const total = qtd * PRECO_UNIDADE;
            document.getElementById('valorTotalDisplay').value = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function adicionarCotas(valor) {
            const campoQtd = document.getElementById('qtdCotas');
            const atual = parseInt(campoQtd.value) || 0;
            campoQtd.value = atual + valor;
            atualizarTotal();
        }

        function mascaraCPF(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            input.value = v;
        }

        async function gerarPix(event) {
            event.preventDefault();

            const cpf = document.getElementById('cpf').value;
            const qtd = parseInt(document.getElementById('qtdCotas').value);
            const valor = qtd * PRECO_UNIDADE;

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "GERANDO PIX...";

            try {
                const resposta = await fetch('/api/pix', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ cpf, valor, qtd })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    alert('Erro: ' + (dados.message || 'Falha ao gerar o Pix'));
                    return;
                }

                if (dados.qr_code) {
                    document.getElementById('campoPixCopiaCola').value = dados.qr_code;
                    document.getElementById('imagemQrCode').src = `data:image/png;base64,${dados.qr_code_base64}`;
                    document.getElementById('modalPix').style.display = 'flex';
                } else {
                    alert('Erro: Não foi possível carregar os dados do Pix.');
                }

            } catch (erro) {
                alert('Erro ao conectar ao servidor de pagamento.');
                console.error(erro);
            } finally {
                btn.disabled = false;
                btn.innerText = "PAGAR COM PIX AGORA 🍀";
            }
        }

        function copiarPix() {
            const campo = document.getElementById('campoPixCopiaCola');
            campo.select();
            campo.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(campo.value);
            alert('Código Pix copiado para a área de transferência!');
        }

        function fecharModal() {
            document.getElementById('modalPix').style.display = 'none';
        }
    </script>
</body>
</html>
